name: PhiPocketRotor E5 Granite Native CPU Smoke

on:
  pull_request:
    paths:
      - "scripts/pocketrotor_e5_granite.py"
      - "scripts/pocketrotor_e5_pilot.py"
      - "tests/test_pocketrotor_e5_granite.py"
      - "scripts/pocketrotor_e2*.py"
      - ".github/workflows/pocketrotor-e5-granite-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-granite-classes-tiny-random-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only Python dependencies (no checkpoint)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==5.21.0"
          python -m pip install -e . --no-deps
      - name: Run genuine Granite library modules with tiny random CPU weights
        run: |
          python -m scripts.pocketrotor_e5_pilot native-smoke --report-output /tmp/pocketrotor-e5-native-report.json --capture-output /tmp/pocketrotor-e5-native-capture.json
          python - <<'PY'
          import json
          report=json.load(open("/tmp/pocketrotor-e5-native-report.json", encoding="utf-8"))
          native=json.load(open("/tmp/pocketrotor-e5-native-capture.json", encoding="utf-8"))
          assert report["status"] == "REAL_GRANITE_CLASSES_SYNTHETIC_CPU_PARITY"
          assert report["bitwise_output_parity"] is True
          assert report["recorded_route_events"] == 32
          assert report["pretrained_checkpoint_executed"] is False
          assert report["actual_model_inference_speedup_proven"] is False
          assert native["source"]["kind"] == "synthetic"
          assert len(native["events"]) == 32
          print("E5 native library test passed, zero pretrained weights used")
          PY
      - name: Save bounded synthetic native-routing metadata
        uses: actions/upload-artifact@v4
        with:
          name: pocketrotor-e5-granite-native-cpu
          path: |
            /tmp/pocketrotor-e5-native-report.json
            /tmp/pocketrotor-e5-native-capture.json
          if-no-files-found: error
          retention-days: 14
