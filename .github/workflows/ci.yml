name: PhiStream CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-fixture-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Automated tests
        run: python -m unittest discover -s tests -v
      - name: Verify checkpoint inspection CLI help (offline)
        run: |
          python -m phistream.cli inspect-checkpoint --help
      - name: Llama token-ID CLI preflight (no model download)
        run: |
          python -m phistream.cli run-llama-ids --help
      - name: Offline reference comparison CLI contracts
        run: |
          python -m phistream.cli fingerprint-checkpoint --help
          python -m phistream.cli compare-reference --help
      - name: Memory preflight CLI contract (offline)
        run: python -m phistream.cli plan-memory --help
      - name: Hardware telemetry and advisory CLI contracts (read-only)
        run: |
          python -m phistream.cli hardware-snapshot --help
          python -m phistream.cli recommend-residency --help
          python -m phistream.cli hardware-snapshot > /tmp/phistream-readonly-hardware.json
      - name: Transfer lab CPU fixture (synthetic and scratch-only)
        run: |
          python -m phistream.cli transfer-lab --help
          python -m phistream.cli transfer-lab --workspace /tmp --gpu none --size-mib 1 --repeats 3 > /tmp/phistream-transfer-cpu.json
      - name: Paired pipeline lab CPU fixture (no GPU claims)
        run: |
          python -m phistream.cli pipeline-lab --help
          python -m phistream.cli pipeline-lab --workspace /tmp --gpu none --size-mib 1 --repeats 4 --warmups 1 > /tmp/phistream-pipeline-cpu.json
      - name: Reuse lab bounded CPU mock smoke
        run: |
          python -m phistream.cli reuse-lab --help
          python -m phistream.cli reuse-lab --workspace /tmp --gpu none --sizes-mib 1 --rounds 6 --warmups 1 > /tmp/phistream-reuse-cpu.json
      - name: Direct readinto lab CPU fixture and help
        run: |
          python -m phistream.cli direct-read-lab --help
          python -m phistream.cli direct-read-lab --workspace /tmp --gpu none --sizes-mib 1 --rounds 6 --warmups 1 > /tmp/phistream-direct-cpu.json
      - name: Chunked event scheduler CPU-only scratch simulation
        run: |
          python -m phistream.cli chunk-lab --help
          python -m phistream.cli chunk-lab --workspace /tmp --gpu none --chunk-mib 1 --chunks 4 --repeats 4 --warmups 1 > /tmp/phistream-chunk-cpu.json
      - name: Overlap intelligence CPU-only synthetic smoke
        run: |
          python -m phistream.cli overlap-lab --help
          python -m phistream.cli overlap-lab --workspace /tmp --gpu none --chunk-mib 1 --chunks 4 --rounds 6 --warmups 1 > /tmp/phistream-overlap-cpu.json
      - name: Guarded scheduler offline receipt-only CLI contract
        run: |
          python -m phistream.cli guarded-scheduler --help
      - name: Scheduler qualification offline CLI help and randomization contract
        run: |
          python -m phistream.cli qualify-scheduler --help
          python -m phistream.cli guarded-scheduler --help
      - name: Governed local real-model bridge preflight CLI help (no model)
        run: |
          python -m phistream.cli real-model-gate --help
      - name: Offline external reference exporter CLI contract (no Transformers import)
        run: |
          python scripts/export_hf_reference.py --help
      - name: Four-case offline real-weight matrix CLI contracts (no inference)
        run: |
          python -m scripts.real_weight_matrix plan --help
          python -m scripts.real_weight_matrix review --help
      - name: SHA-bound weight staging audit CLI (offline, no inference)
        run: |
          python -m scripts.weight_stage_audit --help
      - name: PocketRotor E0 read-only lab CLI (CPU synthetic tests in suite)
        run: python -m scripts.pocketrotor_lab --help
      - name: PocketRotor E1 offline balanced research CLI contracts
        run: |
          python -m scripts.pocketrotor_e1 plan --help
          python -m scripts.pocketrotor_e1 run --help
      - name: PocketRotor E1-A offline audit help (CPU synthetic tests in suite)
        run: python -m scripts.pocketrotor_e1_audit --help
      - name: PocketRotor E2 synthetic predictive expert trace laboratory
        run: |
          python -m scripts.pocketrotor_e2 --help
          python -m scripts.pocketrotor_e2 demo > /tmp/pocketrotor-e2-trace-demo.json
      - name: Reproducible synthetic fixture
        run: |
          python -m phistream.cli init-fixture /tmp/phistream-ci-fixture
          python -m phistream.cli verify /tmp/phistream-ci-fixture
          python -m phistream.cli parity /tmp/phistream-ci-fixture --device cpu
      - name: CPU bench receipts (not a large-model benchmark)
        run: |
          mkdir -p /tmp/phistream-receipts
          python -m phistream.cli bench /tmp/phistream-ci-fixture --mode stream --device cpu > /tmp/phistream-receipts/stream.json
          python -m phistream.cli bench /tmp/phistream-ci-fixture --mode resident --device cpu > /tmp/phistream-receipts/resident.json
      - name: V1 device validation receipt on CPU (no CUDA claims)
        run: |
          python -m phistream.cli doctor --device cpu
          python -m phistream.cli validate-device /tmp/phistream-ci-fixture --device cpu --tokens 8 --output /tmp/phistream-receipts/device-cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: phistream-cpu-synthetic-receipts
          path: /tmp/phistream-receipts/
