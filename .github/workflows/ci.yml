name: PhiStream CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-fixture-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Automated tests
        run: python -m unittest discover -s tests -v
      - name: Verify checkpoint inspection CLI help (offline)
        run: |
          python -m phistream.cli inspect-checkpoint --help
      - name: Llama token-ID CLI preflight (no model download)
        run: |
          python -m phistream.cli run-llama-ids --help
      - name: Offline reference comparison CLI contracts
        run: |
          python -m phistream.cli fingerprint-checkpoint --help
          python -m phistream.cli compare-reference --help
      - name: Memory preflight CLI contract (offline)
        run: python -m phistream.cli plan-memory --help
      - name: Reproducible synthetic fixture
        run: |
          python -m phistream.cli init-fixture /tmp/phistream-ci-fixture
          python -m phistream.cli verify /tmp/phistream-ci-fixture
          python -m phistream.cli parity /tmp/phistream-ci-fixture --device cpu
      - name: CPU bench receipts (not a large-model benchmark)
        run: |
          mkdir -p /tmp/phistream-receipts
          python -m phistream.cli bench /tmp/phistream-ci-fixture --mode stream --device cpu > /tmp/phistream-receipts/stream.json
          python -m phistream.cli bench /tmp/phistream-ci-fixture --mode resident --device cpu > /tmp/phistream-receipts/resident.json
      - name: V1 device validation receipt on CPU (no CUDA claims)
        run: |
          python -m phistream.cli doctor --device cpu
          python -m phistream.cli validate-device /tmp/phistream-ci-fixture --device cpu --tokens 8 --output /tmp/phistream-receipts/device-cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: phistream-cpu-synthetic-receipts
          path: /tmp/phistream-receipts/
