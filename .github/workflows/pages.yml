name: PhiStream React Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'benchmarks/*.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'benchmarks/*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phistream-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build React site and validate committed receipts
        working-directory: site
        run: npm run build
      - name: Check GitHub Pages artifact
        run: |
          test -s site/dist/index.html
          test -s site/dist/benchmarks/build-cpu-stream.json
          test -s site/dist/benchmarks/build-cpu-resident.json
          grep -q 'PhiStream' site/dist/index.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
