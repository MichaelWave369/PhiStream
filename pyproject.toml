[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phistream"
version = "0.1.0"
description = "Original, benchmark-first layer-streaming transformer inference experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2"]
license = "MIT"
authors = [{name = "MichaelWave369"}]

[project.scripts]
phistream = "phistream.cli:main"

[tool.setuptools.packages.find]
include = ["phistream*"]
