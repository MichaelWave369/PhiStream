[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phistream"
version = "0.1.0"
description = "Original, benchmark-first layer-streaming transformer inference experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2"]
license = "MIT"
authors = [{name = "MichaelWave369"}]

[project.scripts]
phistream = "phistream.cli:main"
phi-model-forge = "phistream.model_forge:main"
phi-forge-preflight = "phistream.forge_preflight:main"
phi-forge-review-pack = "phistream.forge_review_pack:main"
phi-forge-curate = "phistream.forge_curate:main"
phi-forge-token-audit = "phistream.forge_token_audit:main"
phi-forge-field-report = "phistream.forge_field:main"
phi-weight-surgery = "phistream.weight_surgery:main"
phi-clavis = "phistream.clavis:main"
phi-clavis-review = "phistream.clavis_evidence:main"
phi-clavis-qualify = "phistream.clavis_qualification:main"
phi-clavis-shadow = "phistream.clavis_shadow:main"
phi-clavis-adaptive = "phistream.clavis_adaptive:main"

[tool.setuptools.packages.find]
include = ["phistream*"]
